name: publish-reel

# Posts the next queued reel (draft release `reel-*`) to Instagram once a day.
# 11:13 UTC = 20:13 Korea time. Minute 0 is the busiest moment on GitHub and scheduled runs
# there get delayed or dropped, so the schedule uses off-peak minutes with several retries
# (20:13, 20:43, 21:13, 22:13 Korea time). A retry is a no-op when the account already
# posted in the last 20 hours.
on:
  schedule:
    - cron: "13 11 * * *"
    - cron: "43 11 * * *"
    - cron: "13 12 * * *"
    - cron: "13 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what would be posted (uncheck to post now)"
        type: boolean
        default: true
      min_gap_hours:
        description: "Skip if the account posted within this many hours (0 = never skip)"
        type: string
        default: "0"

permissions:
  contents: write

concurrency:
  group: publish-reel
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Post next queued reel
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          MIN_GAP: ${{ github.event_name == 'schedule' && '20' || inputs.min_gap_hours || '0' }}
        run: |
          args="--min-gap-hours $MIN_GAP"
          if [ "$DRY_RUN" = "true" ]; then args="$args --dry-run"; fi
          python3 reels-remotion/scripts/publish_queued.py $args
