name: publish-reel

# Posts the next queued reel (draft release `reel-*`) to Instagram once a day.
# Posts one reel every 24 hours (not at a fixed clock time). The schedule just polls every
# 15 minutes at off-peak minutes; each run is a no-op unless the account's last post is
# 24h or older (--min-gap-hours 24). Delayed or dropped polls only shift the next post a bit.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what would be posted (uncheck to post now)"
        type: boolean
        default: true
      min_gap_hours:
        description: "Skip if the account posted within this many hours (0 = never skip)"
        type: string
        default: "0"

permissions:
  contents: write

concurrency:
  group: publish-reel
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Post next queued reel
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          MIN_GAP: ${{ github.event_name == 'schedule' && '24' || inputs.min_gap_hours || '0' }}
        run: |
          args="--min-gap-hours $MIN_GAP"
          if [ "$DRY_RUN" = "true" ]; then args="$args --dry-run"; fi
          python3 reels-remotion/scripts/publish_queued.py $args
